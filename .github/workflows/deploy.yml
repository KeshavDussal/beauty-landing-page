name: Deploy Beauty Landing Page

on:
  push:
    branches:
      - main

env:
  AZURE_CONTAINER_REGISTRY: beautylandingacr.azurecr.io
  IMAGE_NAME: beauty-landing-page
  RESOURCE_GROUP: react
  CONTAINER_APP_NAME: beauty-landing-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name beautylandingacr

      - name: Build Docker image
        run: |
          docker build \
            -t $AZURE_CONTAINER_REGISTRY/$IMAGE_NAME:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push \
            $AZURE_CONTAINER_REGISTRY/$IMAGE_NAME:${{ github.sha }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name $CONTAINER_APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --image $AZURE_CONTAINER_REGISTRY/$IMAGE_NAME:${{ github.sha }}
